---
# DNS providers - where DNS records are written
providers:
  - name: local-adguard
    provider: adguard
    url: "http://adguard:3000"
    username: "admin"
    password: "password"
  - name: local-technitium
    provider: technitium
    url: "https://technitium:5380"
    api_token: "${TECHNITIUM_API_TOKEN:?Please set the TECHNITIUM_API_TOKEN environment variable}"
    zones:
      - example.com

# Sources - reverse proxy instances to discover routes from
sources:
  - name: local-traefik
    type: traefik
    url: "http://traefik:8080"
    target_ip: "172.52.0.11"
    verify_tls: false
    router_filter: ""
